<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RGB Ascension — Rehearsal</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050507;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100vw;height:100vh;background:#050507}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
#time{position:absolute;top:18px;left:50%;transform:translateX(-50%);color:#fff;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;opacity:.72;pointer-events:none}
#phase{position:absolute;left:22px;top:20px;color:#fff;font:12px system-ui,sans-serif;letter-spacing:.18em;opacity:.55;pointer-events:none}
#ui{position:absolute;left:18px;bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:rgba(20,20,22,.78);backdrop-filter:blur(8px);transition:opacity .4s}
button{min-height:44px;padding:8px 16px;border:1px solid #555;border-radius:999px;background:#222;color:#eee;font:inherit}
input{width:150px;vertical-align:middle}
#hint{font-size:12px;opacity:.55}
@media (max-width:700px){#ui{left:10px;right:10px;bottom:10px}#hint{display:none}}
</style>
</head>
<body>
<div id="stage">
<canvas id="canvas"></canvas>
<div id="time">00:00 / 02:00</div>
<div id="phase">EARTH · RED</div>
<div id="ui">
<button id="play" type="button">Pause</button>
<button id="reset" type="button">Reset</button>
<button id="full" type="button">Fullscreen</button>
<label>Duration <input id="duration" type="range" min="30" max="600" step="10" value="120"><span id="dv">120s</span></label>
<span id="hint">Space = play/pause · R = reset · tap canvas</span>
</div>
</div>
<script>
(()=> {
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const play=document.getElementById('play'),reset=document.getElementById('reset'),full=document.getElementById('full');
const duration=document.getElementById('duration'),dv=document.getElementById('dv'),time=document.getElementById('time'),phase=document.getElementById('phase'),ui=document.getElementById('ui');
let W=1,H=1,dpr=1,running=true,elapsed=0,start=performance.now(),hideTimer;
const N=1400,pts=[];
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function seed(){pts.length=0;for(let i=0;i<N;i++)pts.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.00035,vy:(Math.random()-.5)*.00035,s:.25+Math.random()*1.5,seed:Math.random()*1000})}
function mix(a,b,t){return Math.round(a+(b-a)*t)}
function rgb(t){if(t<.5){let q=t*2;return[mix(225,35,q),mix(35,180,q),mix(25,65,q)]}let q=(t-.5)*2;return[mix(35,35,q),mix(180,95,q),mix(65,230,q)]}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function showUI(){ui.style.opacity='1';clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(running)ui.style.opacity='.10'},2500)}
function toggle(){if(running){elapsed=(performance.now()-start)/1000;running=false;play.textContent='Play';showUI()}else{if(elapsed>=+duration.value)elapsed=0;start=performance.now()-elapsed*1000;running=true;play.textContent='Pause';showUI()}}
function restart(){elapsed=0;start=performance.now();running=true;play.textContent='Pause';showUI()}
play.onclick=toggle;reset.onclick=restart;canvas.onclick=()=>{toggle();showUI()};
duration.oninput=()=>{dv.textContent=duration.value+'s';if(elapsed>+duration.value)elapsed=+duration.value;time.textContent=fmt(elapsed)+' / '+fmt(+duration.value);showUI()};
full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}showUI()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.key.toLowerCase()==='r')restart();if(e.key.toLowerCase()==='f')full.click();showUI()});
window.addEventListener('resize',resize);
function draw(now){
 const D=+duration.value;
 if(running){elapsed=(now-start)/1000;if(elapsed>=D){elapsed=D;running=false;play.textContent='Replay'}}
 const t=Math.min(1,Math.max(0,elapsed/D)),[R,G,B]=rgb(t);
 time.textContent=fmt(elapsed)+' / '+fmt(D);
 phase.textContent=t<.33?'EARTH · RED':t<.66?'TREE · GREEN':'SKY · BLUE';
 ctx.fillStyle='rgba(3,3,5,.14)';ctx.fillRect(0,0,W,H);
 const earth=1-Math.min(1,t/.33),tree=Math.max(0,1-Math.abs(t-.5)/.27),sky=Math.max(0,(t-.5)*2);
 for(const p of pts){
   const ang=p.x*9+p.seed*.7+t*5;
   p.x+=p.vx+Math.sin(ang+p.y*12)*.00045*tree+Math.cos(p.y*8+t*4)*.00025*sky;
   p.y+=p.vy+Math.cos(ang+p.x*8)*.00045*sky+earth*.00055-tree*.0009;
   if(p.x<-.02)p.x=1.02;if(p.x>1.02)p.x=-.02;if(p.y<-.02)p.y=1.02;if(p.y>1.02)p.y=-.02;
   const al=.035+.21*(.5+.5*Math.sin(p.seed+p.x*11+p.y*13+t*14));
   ctx.beginPath();ctx.fillStyle=`rgba(${R},${G},${B},${al})`;ctx.arc(p.x*W,p.y*H,.6+p.s*(.7+tree),0,Math.PI*2);ctx.fill();
 }
 const gx=W*(.5+.28*Math.sin(t*Math.PI*2)),gy=H*(.5+.32*Math.cos(t*Math.PI*2)),gr=Math.max(W,H)*(.4+.2*sky);
 const g=ctx.createRadialGradient(gx,gy,0,gx,gy,gr);g.addColorStop(0,`rgba(${R},${G},${B},${.08+.04*sky})`);g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 requestAnimationFrame(draw);
}
resize();seed();ctx.fillStyle='#050507';ctx.fillRect(0,0,W,H);showUI();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
