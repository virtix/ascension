<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RGB Ascension — Rehearsal Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050507;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%;height:100svh;min-height:0;background:#050507;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#ui{position:absolute;z-index:5;left:18px;right:18px;bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:rgba(20,20,22,.82);backdrop-filter:blur(8px);transition:opacity .4s}
button{min-height:44px;padding:8px 16px;border:1px solid #555;border-radius:999px;background:#222;color:#eee;font:inherit}
input{width:150px;vertical-align:middle}
#clock{position:absolute;z-index:4;left:50%;top:16px;transform:translateX(-50%);font:600 18px/1 system-ui,sans-serif;letter-spacing:.08em;color:#fff;opacity:.82;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.7)}#phase{position:absolute;z-index:4;left:22px;top:20px;font-size:12px;letter-spacing:.18em;opacity:.55}
#hint{font-size:12px;opacity:.55}
@media (max-width:700px){#ui{left:10px;right:10px;bottom:10px;padding:8px 10px}#hint{display:none}#ui label{white-space:nowrap}}
@supports not (height:100svh){#stage{height:100vh}}
</style>
</head>
<body>
<div id="stage">
<canvas id="canvas"></canvas>
<div id="clock">0:00 / 3:00</div><div id="phase">EARTH · RED</div>
<div id="ui">
<button id="play">Pause</button>
<button id="reset">Reset</button><button id="full">Fullscreen</button>
<label>Duration <input id="duration" type="range" min="30" max="1800" step="10" value="180"><span id="dv">3:00</span></label>
<span id="hint">Space = play/pause · R = reset · click canvas</span>
</div>
</div>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RGB Ascension — Rehearsal Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050507;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%;height:100svh;min-height:0;background:#050507;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#ui{position:absolute;z-index:5;left:18px;right:18px;bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:rgba(20,20,22,.82);backdrop-filter:blur(8px);transition:opacity .4s}
button{min-height:44px;padding:8px 16px;border:1px solid #555;border-radius:999px;background:#222;color:#eee;font:inherit}
input{width:150px;vertical-align:middle}
#clock{position:absolute;z-index:4;left:50%;top:16px;transform:translateX(-50%);font:600 18px/1 system-ui,sans-serif;letter-spacing:.08em;color:#fff;opacity:.82;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.7)}#phase{position:absolute;z-index:4;left:22px;top:20px;font-size:12px;letter-spacing:.18em;opacity:.55}
#hint{font-size:12px;opacity:.55}
@media (max-width:700px){#ui{left:10px;right:10px;bottom:10px;padding:8px 10px}#hint{display:none}#ui label{white-space:nowrap}}
@supports not (height:100svh){#stage{height:100vh}}
</style>
</head>
<body>
<div id="stage">
<canvas id="canvas"></canvas>
<div id="clock">0:00 / 3:00</div><div id="phase">EARTH · RED</div>
<div id="ui">
<button id="play">Pause</button>
<button id="reset">Reset</button><button id="full">Fullscreen</button>
<label>Duration <input id="duration" type="range" min="30" max="1800" step="10" value="180"><span id="dv">3:00</span></label>
<span id="hint">Space = play/pause · R = reset · click canvas</span>
</div>
</div>
<script>
(()=> {
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const play=document.getElementById('play'), reset=document.getElementById('reset');
const full=document.getElementById('full'), duration=document.getElementById('duration');
const dv=document.getElementById('dv'), clock=document.getElementById('clock'), phase=document.getElementById('phase');
let W=1,H=1,DPR=1, run=true, elapsed=0, startedAt=performance.now();
const particles=Array.from({length:1400},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.00035,vy:(Math.random()-.5)*.00035,s:.25+Math.random()*1.5,seed:Math.random()*1000}));

function size(){const q=canvas.getBoundingClientRect();W=q.width;H=q.height;DPR=Math.min(2,devicePixelRatio||1);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function updateClock(){clock.textContent=fmt(elapsed)+' / '+fmt(+duration.value)}
function toggle(){if(run){elapsed=Math.min((performance.now()-startedAt)/1000,+duration.value);run=false;play.textContent='Play'}else{startedAt=performance.now()-elapsed*1000;run=true;play.textContent='Pause'}updateClock()}
function restart(){elapsed=0;startedAt=performance.now();run=true;play.textContent='Pause';updateClock()}
play.onclick=toggle; reset.onclick=restart;
full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}};
duration.oninput=()=>{dv.textContent=fmt(+duration.value);if(elapsed>+duration.value)elapsed=+duration.value;updateClock()};
canvas.onclick=toggle;
window.addEventListener('resize',size);

function rgb(t){if(t<.5){let q=t*2;return[225-190*q,35+145*q,25+40*q]}let q=(t-.5)*2;return[35,180-85*q,65+165*q]}

function frame(now){
 if(run){
   elapsed=(now-startedAt)/1000;
   if(elapsed>=+duration.value){elapsed=+duration.value;run=false;play.textContent='Replay'}
 }
 updateClock();
 const t=Math.min(1,Math.max(0,elapsed/+duration.value));
 phase.textContent=t<.33?'EARTH · RED':t<.66?'TREE · GREEN':'SKY · BLUE';
 const [R,G,B]=rgb(t);
 ctx.fillStyle='rgba(3,3,5,.14)';ctx.fillRect(0,0,W,H);
 const earth=1-Math.min(1,t/.33),tree=Math.max(0,1-Math.abs(t-.5)/.27),sky=Math.max(0,(t-.5)*2);
 for(const p of particles){
   const ang=p.x*9+p.seed*.7+t*5;
   p.x+=p.vx+Math.sin(ang+p.y*12)*.00045*tree;
   p.y+=p.vy+Math.cos(ang+p.x*8)*.00045*sky+earth*.00055-tree*.0009;
   if(p.x<-.02)p.x=1.02;if(p.x>1.02)p.x=-.02;if(p.y<-.02)p.y=1.02;if(p.y>1.02)p.y=-.02;
   const al=.04+.22*(.5+.5*Math.sin(p.seed+p.x*11+p.y*13+t*14));
   ctx.beginPath();ctx.fillStyle=`rgba(${R},${G},${B},${al})`;ctx.arc(p.x*W,p.y*H,.7+p.s*(.7+tree),0,Math.PI*2);ctx.fill();
 }
 const gx=W*(.5+.28*Math.sin(t*Math.PI*2)),gy=H*(.5+.32*Math.cos(t*Math.PI*2)),gr=Math.max(W,H)*(.4+.2*sky);
 const g=ctx.createRadialGradient(gx,gy,0,gx,gy,gr);g.addColorStop(0,`rgba(${R},${G},${B},${.08+.04*sky})`);g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 requestAnimationFrame(frame);
}
size();dv.textContent=fmt(+duration.value);updateClock();requestAnimationFrame(frame);
})();
</script></script></div>
</body>
</html>
