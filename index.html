<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RGB Ascension — Rehearsal Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050507;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%;height:100svh;min-height:0;background:#050507;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#ui{position:absolute;z-index:5;left:18px;right:18px;bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:rgba(20,20,22,.82);backdrop-filter:blur(8px);transition:opacity .4s}
button{min-height:44px;padding:8px 16px;border:1px solid #555;border-radius:999px;background:#222;color:#eee;font:inherit;cursor:pointer}
input{width:150px;vertical-align:middle}
#hud{position:absolute;z-index:4;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.5em;pointer-events:none;text-align:center;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.85),0 0 4px rgba(0,0,0,.9)}
#clock{display:flex;align-items:baseline;gap:.3em;font:700 clamp(54px,14.25vmin,180px)/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap}
#tot{font-size:.28em;font-weight:500;opacity:.7}
#phase{font-size:clamp(16px,3.4vmin,40px);letter-spacing:.32em;font-weight:600;opacity:.8}
#hint{font-size:12px;opacity:.55}
@media (max-width:700px){#ui{left:10px;right:10px;bottom:10px;padding:8px 10px}#hint{display:none}#ui label{white-space:nowrap}}
@supports not (height:100svh){#stage{height:100vh}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div id="clock"><span id="el">0:00</span><span id="tot">/ 3:00</span></div>
    <div id="phase">EARTH - RED</div>
  </div>
  <div id="ui">
    <button id="play">Pause</button>
    <button id="reset">Reset</button>
    <button id="full">Fullscreen</button>
    <label>Duration <input id="duration" type="range" min="30" max="1800" step="10" value="180"><span id="dv">3:00</span></label>
    <span id="hint">Space = play/pause · R = reset · click canvas</span>
  </div>
</div>

<script>
(()=> {
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d'),play=$('play'),reset=$('reset'),full=$('full'),duration=$('duration'),dv=$('dv'),el=$('el'),tot=$('tot'),phase=$('phase');
let W=1,H=1,DPR=1,run=true,elapsed=0,startedAt=performance.now(),last=performance.now();
const TAU=Math.PI*2;

// RED: lava-lamp metaballs, computed on a small offscreen field and scaled up smooth
const LW=176,LH=100,lc=document.createElement('canvas');lc.width=LW;lc.height=LH;
const lx=lc.getContext('2d'),img=lx.createImageData(LW,LH);
const blobs=[{fixed:1,x:.3,y:1.2,r:.34},{fixed:1,x:.72,y:1.22,r:.3}].concat(
  Array.from({length:9},(_,i)=>({bx:.12+.76*((i*.618)%1),r:.07+Math.random()*.07,sp:TAU/(20+Math.random()*30),ph:Math.random()*TAU,ax:Math.random()*TAU})));
// BLUE: stars
const stars=Array.from({length:670},()=>({a:Math.random()*TAU,r:Math.sqrt(Math.random()),z:Math.pow(Math.random(),2)*.8+.2,s:Math.random()*100}));
// GREEN: cave, droplets, vines, leaves (deterministic)
let far=[],near=[],base=[],stal=[],gens=[[],[],[]],leaves=[];const GDT=.0085;
function build(){
  gens=[[],[],[]];leaves=[];stal=[];
  let s=7;const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
  const NR=160,arc=u=>.09*(2*u-1)**2;
  const mk=(n,dy)=>{
    const pk=Array.from({length:n},()=>({x:r(),h:.07+r()*.09,wl:.05+r()*.07,wr:.05+r()*.07}));
    const a=[];
    for(let i=0;i<=NR;i++){
      const u=i/NR;let h=0;
      for(const q of pk){const d=u-q.x,w=d<0?q.wl:q.wr;h=Math.max(h,q.h*Math.max(0,1-Math.abs(d)/w))}
      h+=.012*Math.sin(u*90+dy*50)+.02*Math.abs(Math.sin(u*21+dy*30))+r()*.006;
      a.push([u,.2+dy-h+arc(u)]);
    }
    return a;
  };
  far=mk(6,-.03);near=mk(7,0);
  base=[];for(let i=0;i<=NR;i++){const u=i/NR;base.push([u,.27+r()*.025+(r()<.08?.03:0)+arc(u)])}
  for(let k=0;k<12;k++)stal.push({i:Math.floor((k+.25+r()*.5)/12*NR),len:.03+r()*.05,P:3+r()*3,off:r()*10});
  const step=.011;
  function branch(x,y,a,n,g,t0){
    for(let i=0;i<n;i++){
      a+=(r()-.5)*.32;
      const nx=x+Math.cos(a)*step*(1-g*.15),ny=y+Math.sin(a)*step*(1-g*.15),t=t0+i*GDT;
      gens[g].push([x,y,nx,ny,t]);
      if(i%5===2)leaves.push([nx,ny,a+(i%10<5?-1:1)*(.9+r()*.4),t,.03+r()*.02,i%2]);
      if(g<2&&i>8&&i%12===0&&r()<.75)branch(nx,ny,a+(r()<.5?-1:1)*(.45+r()*.5),Math.floor(n*.55),g+1,t);
      x=nx;y=ny;
    }
  }
  stal.forEach((q,k)=>{if(k%2)return;const u=base[q.i][0];branch((W*(u*1.04-.02)-W/2)/H,.87,-1.5708+(r()-.5)*.5,Math.floor(45+r()*25),0,r()*.15)});
}

function size(){const q=canvas.getBoundingClientRect();W=q.width;H=q.height;DPR=Math.min(2,devicePixelRatio||1);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);build()}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function updateClock(){el.textContent=fmt(elapsed);tot.textContent='/ '+fmt(+duration.value)}
function toggle(){if(run){elapsed=Math.min((performance.now()-startedAt)/1000,+duration.value);run=false;play.textContent='Play'}else{startedAt=performance.now()-elapsed*1000;run=true;play.textContent='Pause'}updateClock()}
function restart(){elapsed=0;startedAt=performance.now();run=true;play.textContent='Pause';updateClock()}
play.onclick=toggle; reset.onclick=restart;
full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}};
duration.oninput=()=>{dv.textContent=fmt(+duration.value);if(elapsed>+duration.value)elapsed=+duration.value;updateClock()};
canvas.onclick=toggle;
window.addEventListener('resize',size);
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='r'||e.key==='R'){restart()}});

const S=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};

function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(run){
   elapsed=(now-startedAt)/1000;
   if(elapsed>=+duration.value){elapsed=+duration.value;run=false;play.textContent='Replay'}
 }
 updateClock();
 const d=run?dt:0;
 const t=Math.min(1,Math.max(0,elapsed/+duration.value));
 phase.textContent=t<.33?'EARTH - RED':t<.66?'LIFE - GREEN':'ASCENSION - BLUE';
 const wb=S(.61,.71,t),wr=1-S(.28,.38,t),wg=(1-wr)*(1-wb);
 const sc=Math.max(.8,H/900),Rm=Math.hypot(W,H)/2;

 ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='rgba(3,3,5,.13)';ctx.fillRect(0,0,W,H);

 // RED — lava lamp
 if(wr>.01){
   const bl=blobs.map(b=>b.fixed?{x:b.x*W+Math.sin(elapsed*.15+b.x*9)*.02*W,y:b.y*H,rr:(b.r*H)**2}:
     {x:b.bx*W+Math.sin(elapsed*b.sp*.6+b.ax)*.05*W,y:(.58+.46*Math.sin(elapsed*b.sp+b.ph))*H,rr:(b.r*H)**2});
   const dta=img.data;let o=0;
   for(let j=0;j<LH;j++){
     const py=(j+.5)*H/LH;
     for(let i=0;i<LW;i++){
       const px=(i+.5)*W/LW;let f=0;
       for(const b of bl){const dx=px-b.x,dy=py-b.y;f+=b.rr/(dx*dx+dy*dy+1)}
       const h=Math.min(1,f*f)*150,c=f<.92?0:f>1.08?1:(f-.92)/.16,k=Math.min(1,Math.max(0,(f-1)/2));
       dta[o++]=105+c*60+55*k;dta[o++]=6+c*8+55*k;dta[o++]=5+c*3+8*k;dta[o++]=h+(255-h)*c;
     }
   }
   lx.putImageData(img,0,0);
   ctx.globalCompositeOperation='source-over';ctx.imageSmoothingEnabled=true;
   ctx.globalAlpha=wr;ctx.drawImage(lc,0,0,W,H);ctx.globalAlpha=1;
 }

 // GREEN — life growing out of a cave
 if(wg>.01){
   ctx.globalCompositeOperation='source-over';ctx.lineCap='round';
   const g=Math.max(0,(t-.495)/.15),cx=W/2;
   const ig=ctx.createRadialGradient(cx,H,0,cx,H,H*.55);
   ig.addColorStop(0,`rgba(60,170,90,${.14*wg})`);ig.addColorStop(1,'rgba(0,0,0,0)');
   ctx.fillStyle=ig;ctx.fillRect(0,0,W,H);
   // jagged mountains above the timer
   const X=u=>W*(u*1.04-.02);
   const crest=pts=>{ctx.beginPath();pts.forEach((q,i)=>{i?ctx.lineTo(X(q[0]),q[1]*H):ctx.moveTo(X(q[0]),q[1]*H)})};
   const ridge=(pts,col)=>{crest(pts);for(let i=base.length-1;i>=0;i--)ctx.lineTo(X(base[i][0]),base[i][1]*H);ctx.closePath();ctx.fillStyle=col;ctx.fill();crest(pts);ctx.strokeStyle=`rgba(190,215,205,${.2*wg})`;ctx.lineWidth=1.2*sc;ctx.stroke()};
   ridge(far,`rgba(38,52,46,${.5*wg})`);ridge(near,`rgba(26,32,29,${.8*wg})`);
   // stalactites + dripping water
   const floorY=H*.87;
   for(const s of stal){
     const bx=X(base[s.i][0]),by=base[s.i][1]*H,w=.012*H,tipY=by+s.len*H;
     ctx.beginPath();ctx.moveTo(bx-w,by-2);ctx.lineTo(bx+w,by-2);ctx.lineTo(bx,tipY);ctx.closePath();
     ctx.fillStyle=`rgba(45,56,50,${.8*wg})`;ctx.fill();
     const u=((elapsed+s.off)%s.P)/s.P;
     if(u<.5){const rr=(1+2.6*u/.5)*sc;ctx.beginPath();ctx.arc(bx,tipY+rr,rr,0,TAU);ctx.fillStyle=`rgba(170,225,255,${.8*wg})`;ctx.fill()}
     else if(u<.72){const k=(u-.5)/.22,y=tipY+k*k*(floorY-tipY);ctx.beginPath();ctx.ellipse(bx,y,2*sc,3.4*sc,0,0,TAU);ctx.fillStyle=`rgba(190,235,255,${.85*wg})`;ctx.fill()}
     else{const k=(u-.72)/.28,rx=k*.06*H;ctx.beginPath();ctx.ellipse(bx,floorY,rx,rx*.28,0,0,TAU);ctx.strokeStyle=`rgba(170,225,255,${(1-k)*.4*wg})`;ctx.lineWidth=1.2*sc;ctx.stroke()}
   }
   // vines
   const cols=['rgba(60,150,70,','rgba(80,185,90,','rgba(130,215,120,'];
   for(let k=0;k<3;k++){
     ctx.beginPath();
     for(const s of gens[k]){
       const f=Math.min(1,(g-s[4])/GDT);if(f<=0)continue;
       const x0=cx+s[0]*H,y0=s[1]*H;
       ctx.moveTo(x0,y0);ctx.lineTo(x0+(s[2]-s[0])*H*f,y0+(s[3]-s[1])*H*f);
     }
     ctx.strokeStyle=cols[k]+(.22*wg)+')';ctx.lineWidth=(2.4-k*.7)*sc;ctx.stroke();
   }
   // leaves
   for(let c=0;c<2;c++){
     ctx.beginPath();
     for(const l of leaves){
       if(l[5]!==c)continue;
       const f=Math.min(1,(g-l[3])/.06);if(f<=0)continue;
       const x=cx+l[0]*H,y=l[1]*H,L=l[4]*H*f,w=L*.42,ca=Math.cos(l[2]),sa=Math.sin(l[2]);
       ctx.moveTo(x,y);
       ctx.quadraticCurveTo(x+ca*L*.5-sa*w,y+sa*L*.5+ca*w,x+ca*L,y+sa*L);
       ctx.quadraticCurveTo(x+ca*L*.5+sa*w,y+sa*L*.5-ca*w,x,y);
     }
     ctx.fillStyle=(c?'rgba(130,215,120,':'rgba(70,170,85,')+(.2*wg)+')';ctx.fill();
   }
 }

 // BLUE — stars and nebula
 if(wb>.01){
   ctx.globalCompositeOperation='lighter';
   [[.3,.4,.55,'40,70,200',.06],[.72,.62,.5,'100,50,190',.045],[.5,.2,.45,'30,130,210',.04]].forEach(([nx,ny,nr,c,a],i)=>{
     const ox=(nx-.5)*W,oy=(ny-.5)*H,rt=elapsed*.012,x=W/2+ox*Math.cos(rt)-oy*Math.sin(rt),y=H/2+ox*Math.sin(rt)+oy*Math.cos(rt);
     const g=ctx.createRadialGradient(x,y,0,x,y,H*nr);
     g.addColorStop(0,`rgba(${c},${a*wb})`);g.addColorStop(1,`rgba(${c},0)`);
     ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
   });
   for(const s of stars){
     
     const tw=.5+.5*Math.sin(elapsed*(.7+s.z*2.2)+s.s);
     const a=(.25+.75*tw)*(.35+.65*s.z)*wb,r=(.5+s.z*1.3)*sc,an=s.a+elapsed*.012*(.85+.3*s.z),x=W/2+Math.cos(an)*s.r*Rm,y=H/2+Math.sin(an)*s.r*Rm;
     if(s.z>.985){const gl=ctx.createRadialGradient(x,y,0,x,y,r*7);gl.addColorStop(0,`rgba(190,215,255,${a*.45})`);gl.addColorStop(1,'rgba(190,215,255,0)');ctx.fillStyle=gl;ctx.fillRect(x-r*7,y-r*7,r*14,r*14)}
     ctx.fillStyle=`rgba(${200+s.z*55|0},${215+s.z*40|0},255,${a})`;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
   }
 }
 ctx.globalCompositeOperation='source-over';
 requestAnimationFrame(frame);
}
size();dv.textContent=fmt(+duration.value);updateClock();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
